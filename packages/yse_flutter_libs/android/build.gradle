// Build configuration for yse_flutter_libs — deprecated (#96).
//
// package:yse's native-assets build hook bundles libyse.so for the target
// ABI into the APK / AAB itself, so this plugin no longer packages anything.
// Up to 0.2.0 it added the engine's prebuilt Android release as jniLibs
// (#91); keeping that would put a second lib/<abi>/libyse.so next to the
// hook's and fail the app's native-library merge. What remains is an empty
// Android library module, so an app that still lists yse_flutter_libs keeps
// building. Remove the dependency: `yse` alone is enough.
//
// The plugin carries no Dart, Kotlin or Java code (it is declared as an
// `ffiPlugin` in pubspec.yaml, so Flutter needs no plugin class and this
// module applies no Kotlin Gradle Plugin, #93).

group = 'net.attrx.yse_flutter_libs'
version = '0.3.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Only used when this module is opened on its own. Inside a Flutter
        // app the host's Android Gradle Plugin (AGP 8 or 9) is already on the
        // classpath and takes precedence, so this pin sets no minimum.
        classpath 'com.android.tools.build:gradle:8.5.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace = 'net.attrx.yse_flutter_libs'
    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // No minSdk: up to 0.2.0 the plugin's minSdk 26 failed the manifest
    // merge of any app below it. The engine itself still wants API 26
    // (Oboe's AAudio backend); the app sets that.
}

dependencies {
    // None: the plugin ships nothing.
}
