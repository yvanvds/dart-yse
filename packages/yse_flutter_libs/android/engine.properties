# The libYSE release this plugin packages (#91). build.gradle downloads
# https://github.com/yvanvds/yse-soundengine/releases/download/<engineTag>/libyse-<engineTag>-android.tar.gz
# and refuses an archive whose sha256 differs from engineSha256.
#
# Keep engineTag equal to the tag the dart-yse engine submodule pins:
# test/flutter_libs_engine_test.dart fails when they drift. On a bump, take
# the new digest from the release page or from
#   gh api repos/yvanvds/yse-soundengine/releases/tags/<tag> --jq '.assets[] | .name + " " + .digest'
engineTag=v3.1.0
engineSha256=f30526c3a21ee6805445c51411b089e5f1f836e425b2ddca44c86511261d4d72
