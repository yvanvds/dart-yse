name: yse_flutter_libs
description: >-
  Deprecated, never published: package:yse's build hook now bundles the YSE
  engine's libyse.so into Flutter Android apps itself. This plugin packages
  nothing and only keeps apps that still list it building.
version: 0.3.0
# Not published to pub.dev (#96): package names there are permanent, and
# package:yse alone covers Android. See README.md.
publish_to: 'none'
repository: https://github.com/yvanvds/dart-yse
issue_tracker: https://github.com/yvanvds/dart-yse/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        # An FFI plugin: no Android plugin class, no Kotlin or Java. Flutter
        # includes android/build.gradle in the host app's build, which is now
        # an empty Android library module (#96).
        ffiPlugin: true
