name: yse
description: Dart bindings for the YSE sound engine — 3D audio playback, mixing, DSP, MIDI, and generative music.
version: 0.2.0
homepage: https://yvanvds.github.io/dart-yse/
repository: https://github.com/yvanvds/dart-yse
issue_tracker: https://github.com/yvanvds/dart-yse/issues

topics:
  - audio
  - sound
  - midi
  - dsp
  - ffi

# The platforms the build hook bundles a prebuilt engine for (hook/build.dart,
# #95 / #96). macOS and iOS have no engine release yet.
platforms:
  windows:
  linux:
  android:

environment:
  # Build hooks (hook/build.dart, #95) are stable from Dart 3.10 on.
  sdk: ^3.10.0

dependencies:
  # The native-assets build hook (hook/build.dart, #95) downloads the pinned
  # libYSE release, checks its sha256 (crypto; also used by
  # tool/fetch_engine.dart) and reports it as a code asset.
  code_assets: ^2.0.0
  crypto: ^3.0.0
  ffi: ^2.1.3
  hooks: ^2.0.0

dev_dependencies:
  ffigen: ^20.1.1
  test: ^1.25.0
  lints: ^5.0.0
  # tool/emit_api_rst.dart walks the public API surface to emit RST
  # pages for the Sphinx docs site (docs/). Lexical analysis only —
  # no type resolution — so we keep the dependency loose.
  analyzer: ^7.0.0
